name: Build installers and release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify version tag
        shell: python
        run: |
          import json, os
          version = json.load(open('PrintableThreads/PrintableThreads.manifest'))['version']
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Build macOS package and portable ZIP
        if: runner.os == 'macOS'
        run: python packaging/build.py --macos
      - name: Test macOS installation and upgrade
        if: runner.os == 'macOS'
        run: python -m unittest discover -s packaging -p 'test_*.py'
      - name: Compile Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          foreach ($script in Get-ChildItem packaging/windows -Filter '*.ps1') {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw "PowerShell syntax error in $($script.Name): $errors" }
          }
          if (-not (Test-Path $compiler)) { choco install innosetup --yes --no-progress; if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' } }
          $version = (Get-Content -Raw PrintableThreads/PrintableThreads.manifest | ConvertFrom-Json -AsHashtable).version
          & $compiler "/DVersion=$version" packaging/windows/PrintableThreads.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }
      - name: Test Windows install, upgrade and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/test-install.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            dist/*.pkg
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist
      - name: Create checksums and publish engineering preview
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python packaging/build.py --checksums-only
          gh release create "$RELEASE_TAG" dist/* --verify-tag --prerelease --title "Printable Threads $RELEASE_TAG" --notes-file "docs/RELEASE-${RELEASE_TAG#v}.md"
